<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global Supply Chain Tracker</title>

<style>
body { font-family: Arial; margin:0; background:#f4f4f4; }
header { background:black; color:white; padding:15px; text-align:center; }
nav { background:#333; padding:10px; text-align:center; }
nav a { color:white; margin:10px; text-decoration:none; }

section { padding:20px; }

.card {
    background:white;
    padding:15px;
    margin:10px;
    border-radius:10px;
}

.grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(120px,1fr));
    gap:10px;
}

.country {
    background:white;
    padding:10px;
    text-align:center;
    cursor:pointer;
    border-radius:10px;
}

.country img {
    width:40px;
    height:25px;
}

#map { height:300px; width:100%; }

button {
    padding:10px;
    background:black;
    color:white;
    border:none;
}

input { padding:10px; }

</style>
</head>

<body>

<header>
<h1>Global Supply Chain Tracker</h1>
</header>

<nav>
<a href="#countries">Countries</a>
<a href="#mapSection">Map</a>
<a href="#tracking">Tracking</a>
</nav>

<!-- 🌍 COUNTRIES -->
<section id="countries">
<h2>Select Country</h2>
<div class="grid" id="countryList"></div>
</section>

<!-- 🗺️ MAP -->
<section id="mapSection">
<h2>Shipment Route</h2>
<div id="map"></div>
</section>

<!-- 📦 TRACKING -->
<section id="tracking">
<h2>Tracking</h2>

<input id="steps" placeholder="Steps">
<button onclick="calc()">Calculate Cost</button>

<div id="result" class="card"></div>
<div id="routeSteps" class="card"></div>

</section>

// 🎯 Load Countries
let list = document.getElementById("countryList");
countries.forEach((c, i) => {
    list.innerHTML += `
    <div class="country" onclick="selectCountry(${i})">
        <img src="${c.flag}"><br>${c.name}
    </div>`;
});

// 🗺️ MAP
let map, marker, route = [];

function initMap(){
    map = new google.maps.Map(document.getElementById("map"), {
        zoom: 2,
        center: {lat:20, lng:0}
    });
}

function selectCountry(i){
    let c = countries[i];
    route.push(c);

    if(!marker){
        marker = new google.maps.Marker({position:c, map:map});
    } else {
        marker.setPosition(c);
    }

    map.panTo(c);

    showRoute();
}

// 📦 SHOW ROUTE
function showRoute(){
    let text = "Route:<br>";
    route.forEach(r => text += "→ " + r.name + "<br>");
    document.getElementById("routeSteps").innerHTML = text;
}

// 💰 COST
function calc(){
    let n = document.getElementById("steps").value;
    let cost = 30 * Math.pow(1.1, n) * 1.5;
    document.getElementById("result").innerHTML = "Cost: $" + cost.toFixed(2);
}

</script>

<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"
async defer></script>

</body>
</html>

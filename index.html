<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Supply Chain</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f4f6f9}

/* HEADER */
header{
background:#0B1F3A;color:white;
padding:15px 40px;
display:flex;justify-content:space-between;
}
nav a{margin-left:20px;cursor:pointer}

/* HERO */
.hero{
height:100vh;
background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg');
background-size:cover;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
color:white;text-align:center;
}

/* SECTION */
.section{display:none;padding:40px;text-align:center}
.active{display:block}

/* FORM */
.form{
background:white;padding:20px;border-radius:10px;
max-width:400px;margin:auto;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
.form input,.form select{
width:100%;padding:10px;margin:10px 0;
}

button{padding:10px;background:gold;border:none}

/* MAP */
.map{
position:relative;height:300px;margin-top:30px;
background:url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg');
background-size:cover;
}

.dot{
width:12px;height:12px;background:red;
border-radius:50%;
position:absolute;
transition:4s linear;
}

/* TIMELINE */
.timeline{
margin-top:20px;text-align:left;max-width:500px;margin:auto;
}
.step{
padding:10px;border-left:3px solid #0B1F3A;margin-bottom:10px;
}

/* GRID */
.grid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;margin-top:20px;
}
.card{
background:white;padding:15px;border-radius:10px;
}
</style>
</head>

<body>

<header>
<h3>Smart Supply Chain</h3>
<nav>
<a onclick="show('home')">Home</a>
<a onclick="show('tracking')">Tracking</a>
<a onclick="show('warehouse')">Warehouses</a>
</nav>
</header>

<!-- HOME -->
<div id="home" class="hero active">
<h1>Supply Chain System</h1>
<p>Track shipments from supplier to customer</p>
</div>

<!-- TRACKING -->
<div id="tracking" class="section">

<h2>Shipment Tracking</h2>

<div class="form">
<select id="from">
<option>Egypt</option>
<option>Italy</option>
<option>China</option>
</select>

<select id="to">
<option>France</option>
<option>Canada</option>
<option>Germany</option>
</select>

<input id="weight" placeholder="Weight (kg)">
<button onclick="run()">Start Tracking</button>
</div>

<div id="result"></div>

<div class="timeline" id="timeline"></div>

<div class="map">
<div class="dot" id="dot"></div>
</div>

</div>

<!-- WAREHOUSE -->
<div id="warehouse" class="section">
<h2>Warehouses</h2>

<div class="grid">
<div class="card">🇪🇬 Egypt<br>Near Cairo Airport & Port</div>
<div class="card">🇫🇷 France<br>Near Paris Airport & Port</div>
<div class="card">🇨🇦 Canada<br>Near Toronto Airport & Port</div>
<div class="card">🇩🇪 Germany<br>Near Berlin Airport & Port</div>
</div>

</div>

<script>

/* NAV */
function show(id){
document.querySelectorAll('.section,.hero').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

/* LOCATIONS */
const points={
Egypt:{x:30,y:65},
Italy:{x:45,y:40},
China:{x:20,y:50},
France:{x:55,y:35},
Canada:{x:60,y:30},
Germany:{x:50,y:35}
};

/* DISTANCE */
function dist(a,b){
let dx=a.x-b.x;
let dy=a.y-b.y;
return Math.sqrt(dx*dx+dy*dy)*100;
}

/* RUN */
function run(){

let from=document.getElementById("from").value;
let to=document.getElementById("to").value;
let weight=parseFloat(document.getElementById("weight").value);

let supplier=points[from];
let warehouse=points[from]; // نفس الدولة
let destination=points[to];

let d1=48; // supplier → warehouse (hours)
let d2=Math.ceil(dist(warehouse,destination)/20); // days

let totalDays=Math.ceil(d1/24)+d2;
let cost=weight*60;

/* RESULT */
result.innerHTML=
`📦 ${from} → ${to}<br>
⏱ Total: ${totalDays} days<br>
💰 Cost: $${cost}`;

/* TIMELINE */
timeline.innerHTML=
`
<div class="step">Supplier → Warehouse (≤48h)</div>
<div class="step">Warehouse → Carrier</div>
<div class="step">Carrier → Customer (${d2} days)</div>
`;

/* ANIMATION */
let dot=document.getElementById("dot");

dot.style.left=supplier.x+"%";
dot.style.top=supplier.y+"%";

setTimeout(()=>{
dot.style.left=warehouse.x+"%";
dot.style.top=warehouse.y+"%";
},1000);

setTimeout(()=>{
dot.style.left=destination.x+"%";
dot.style.top=destination.y+"%";
},4000);

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global Supply Chain Tracker</title>

<style>
body { font-family: Arial; margin:0; background:#f4f4f4; }
header { background:black; color:white; padding:15px; text-align:center; }
nav { background:#333; padding:10px; text-align:center; }
nav a { color:white; margin:10px; text-decoration:none; }

section { padding:20px; }

.card {
    background:white;
    padding:15px;
    margin:10px;
    border-radius:10px;
}

.grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(120px,1fr));
    gap:10px;
}

.country {
    background:white;
    padding:10px;
    text-align:center;
    cursor:pointer;
    border-radius:10px;
    transition:0.3s;
}
.country:hover { background:#ddd; }

.country img {
    width:40px;
    height:25px;
}

#map { height:350px; width:100%; }

button {
    padding:10px;
    background:black;
    color:white;
    border:none;
    cursor:pointer;
}

input { padding:10px; }

</style>
</head>

<body>

<header>
<h1>Global Supply Chain Tracker</h1>
</header>

<nav>
<a href="#countries">Countries</a>
<a href="#mapSection">Map</a>
<a href="#tracking">Tracking</a>
</nav>

<section id="countries">
<h2>Select Country</h2>
<div class="grid" id="countryList"></div>
</section>

<section id="mapSection">
<h2>Shipment Route</h2>
<div id="map"></div>
</section>

<section id="tracking">
<h2>Tracking</h2>

<input type="number" id="steps" placeholder="Steps">
<button onclick="calc()">Calculate Cost</button>

<div id="result" class="card"></div>
<div id="routeSteps" class="card"></div>

</section>

<script>

// 🌍 COUNTRIES
let countries = [
{name:"China", lat:31.2304, lng:121.4737, flag:"https://flagcdn.com/w40/cn.png"},
{name:"UAE", lat:25.2769, lng:55.2962, flag:"https://flagcdn.com/w40/ae.png"},
{name:"Egypt", lat:30.0444, lng:31.2357, flag:"https://flagcdn.com/w40/eg.png"},
{name:"USA", lat:37.7749, lng:-122.4194, flag:"https://flagcdn.com/w40/us.png"},
{name:"Germany", lat:52.52, lng:13.405, flag:"https://flagcdn.com/w40/de.png"},
{name:"India", lat:28.6139, lng:77.2090, flag:"https://flagcdn.com/w40/in.png"},
{name:"Brazil", lat:-23.5505, lng:-46.6333, flag:"https://flagcdn.com/w40/br.png"},
{name:"Japan", lat:35.6762, lng:139.6503, flag:"https://flagcdn.com/w40/jp.png"}
];

// عرض الدول
let list = document.getElementById("countryList");
countries.forEach((c, i) => {
    list.innerHTML += `
    <div class="country" onclick="selectCountry(${i})">
        <img src="${c.flag}"><br>${c.name}
    </div>`;
});

// 🗺️ MAP
let map, marker, route = [], polyline;

function initMap(){
    map = new google.maps.Map(document.getElementById("map"), {
        zoom: 2,
        center: {lat:20, lng:0}
    });
}

// اختيار دولة
function selectCountry(i){
    let c = countries[i];
    route.push(c);

    if(!marker){
        marker = new google.maps.Marker({position:c, map:map});
    } else {
        marker.setPosition(c);
    }

    map.panTo(c);

    drawRoute();
    showRoute();
}

// رسم خط بين الدول
function drawRoute(){
    if(polyline) polyline.setMap(null);

    polyline = new google.maps.Polyline({
        path: route,
        geodesic: true,
        strokeColor: "#FF0000",
        strokeOpacity: 1.0,
        strokeWeight: 2
    });

    polyline.setMap(map);
}

// عرض المسار
function showRoute(){
    let text = "<b>Route:</b><br>";
    route.forEach((r, index) => {
        text += (index+1) + "- " + r.name + "<br>";
    });
    document.getElementById("routeSteps").innerHTML = text;
}

// 💰 COST
function calc(){
    let n = document.getElementById("steps").value;

    if(n === "" || n < 0){
        document.getElementById("result").innerHTML = "Enter valid steps ❌";
        return;
    }

    let cost = 30 * Math.pow(1.1, n) * 1.5;

    document.getElementById("result").innerHTML =
    "<b>Final Cost:</b> $" + cost.toFixed(2);
}

</script>

<!-- ⚠️ PUT YOUR GOOGLE API KEY -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"
async defer></script>

</body>
</html>

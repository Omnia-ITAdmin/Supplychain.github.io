<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Supply Chain Pro</title>

<style>
body{font-family:Arial;background:#f4f6f9;margin:0}
header{background:#0B1F3A;color:white;padding:15px;text-align:center}
.section{padding:30px;text-align:center}

.form{
background:white;padding:20px;border-radius:10px;
max-width:400px;margin:auto;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
input,select{width:100%;padding:10px;margin:10px 0}

button{padding:10px;background:gold;border:none;cursor:pointer}

#result{
margin-top:20px;background:white;padding:15px;border-radius:10px;
}

.timeline{margin-top:20px;text-align:left;max-width:500px;margin:auto}
.step{padding:10px;border-left:4px solid #0B1F3A;margin-bottom:10px;background:#fff}

.map{
position:relative;height:300px;margin-top:20px;
background:url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg');
background-size:cover;
}
.dot{
width:14px;height:14px;background:red;border-radius:50%;
position:absolute;transition:4s linear;
}
</style>
</head>

<body>

<header>
<h2>Smart Supply Chain Pro</h2>
</header>

<div class="section">

<h3>iPhone Shipment Calculator</h3>

<div class="form">

<input id="qty" type="number" placeholder="Number of iPhones">

<select id="shippingType">
<option value="air">✈️ Air</option>
<option value="sea">🚢 Sea</option>
</select>

<select id="from">
<option>China</option>
<option>Egypt</option>
<option>Italy</option>
</select>

<select id="to">
<option>France</option>
<option>Canada</option>
<option>Germany</option>
</select>

<input id="email" placeholder="Email">

<button onclick="calculate()">Calculate Shipment</button>

</div>

<div id="result"></div>
<div id="timeline" class="timeline"></div>

<div class="map">
<div class="dot" id="dot"></div>
</div>

</div>

<script>

/* DATA */
const locations={
China:{x:20,y:50},
Egypt:{x:30,y:65},
Italy:{x:45,y:40},
France:{x:55,y:35},
Canada:{x:60,y:30},
Germany:{x:50,y:35}
};

/* DISTANCE */
function dist(a,b){
let dx=a.x-b.x;
let dy=a.y-b.y;
return Math.sqrt(dx*dx+dy*dy)*100;
}

/* MAIN */
function calculate(){

let qty=parseInt(document.getElementById("qty").value);
let type=document.getElementById("shippingType").value;
let from=document.getElementById("from").value;
let to=document.getElementById("to").value;
let email=document.getElementById("email").value;

if(!qty || qty<=0){
result.innerHTML="❌ Enter valid quantity";
return;
}

/* 📦 Weight */
let weight=qty*0.2;

/* 📦 Volumetric Weight */
let volumetric=qty*0.3;

/* use higher */
let finalWeight=Math.max(weight,volumetric);

/* 💰 Base Cost */
let cost=finalWeight*60;

/* ✈️ Air / 🚢 Sea */
let days;
if(type==="air"){
cost*=1.5;
days=3+Math.ceil(dist(locations[from],locations[to])/30);
}else{
cost*=1;
days=20+Math.ceil(dist(locations[from],locations[to])/15);
}

/* 🛃 Customs */
let customs=cost*0.1;

/* 💰 Total */
let total=cost+customs;

/* RESULT */
result.innerHTML=
`📱 iPhone Shipment<br>
📦 Qty: ${qty}<br>
⚖ Weight: ${finalWeight.toFixed(1)} kg<br>
🚚 Type: ${type}<br>
⏱ Delivery: ${days} days<br>
🛃 Customs: $${customs.toFixed(0)}<br>
💰 Total Cost: $${total.toFixed(0)}<br>
📧 Sent to: ${email}`;

/* TIMELINE */
timeline.innerHTML=
`
<div class="step">🏭 Production Complete</div>
<div class="step">📦 Warehouse (48h)</div>
<div class="step">${type==="air"?"✈️ Air Shipping":"🚢 Sea Shipping"}</div>
<div class="step">🛃 Customs Clearance</div>
<div class="step">🚚 Delivery</div>
`;

/* MAP */
let dot=document.getElementById("dot");
let start=locations[from];
let end=locations[to];

dot.style.left=start.x+"%";
dot.style.top=start.y+"%";

setTimeout(()=>{
dot.style.left=end.x+"%";
dot.style.top=end.y+"%";
},2000);

}

</script>

</body>
</html>

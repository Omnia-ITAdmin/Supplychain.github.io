<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Supply Chain</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f4f6f9}

/* HEADER */
header{
background:#0B1F3A;color:white;
padding:15px 40px;
display:flex;justify-content:space-between;
}
nav a{margin-left:20px;cursor:pointer}

/* HERO */
.hero{
height:100vh;
background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg');
background-size:cover;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
color:white;text-align:center;
}

/* SECTION */
.section{display:none;padding:40px;text-align:center}
.active{display:block}

/* FORM */
.form{
background:white;padding:20px;border-radius:10px;
max-width:400px;margin:auto;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
.form input,.form select{
width:100%;padding:10px;margin:10px 0;
}

button{padding:10px;background:gold;border:none;cursor:pointer}

/* RESULT */
#result{
margin-top:20px;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}

/* MAP */
.map{
position:relative;height:300px;margin-top:30px;
background:url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg');
background-size:cover;
border-radius:10px;
}

.dot{
width:14px;height:14px;background:red;
border-radius:50%;
position:absolute;
transition:4s linear;
}

/* TIMELINE */
.timeline{
margin-top:20px;text-align:left;max-width:600px;margin:auto;
}
.timeline h3{
margin:20px 0;
color:#0B1F3A;
}
.step{
padding:12px;
border-left:5px solid #0B1F3A;
margin-bottom:10px;
background:#fff;
border-radius:5px;
box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;margin-top:20px;
}
.card{
background:white;padding:15px;border-radius:10px;
box-shadow:0 5px 10px rgba(0,0,0,0.1);
}
</style>
</head>

<body>

<header>
<h3>Smart Supply Chain</h3>
<nav>
<a onclick="show('home')">Home</a>
<a onclick="show('tracking')">Tracking</a>
<a onclick="show('warehouse')">Warehouses</a>
</nav>
</header>

<!-- HOME -->
<div id="home" class="hero active">
<h1>iPhone Supply Chain System</h1>
<p>Track full production to delivery lifecycle</p>
</div>

<!-- TRACKING -->
<div id="tracking" class="section">

<h2>iPhone Shipment Tracking</h2>

<div class="form">

<select id="from">
<option>China</option>
<option>Italy</option>
<option>Egypt</option>
</select>

<select id="to">
<option>France</option>
<option>Canada</option>
<option>Germany</option>
</select>

<input id="weight" type="number" placeholder="Weight (kg)">
<input id="email" type="email" placeholder="Enter Email">

<button onclick="run()">Start Tracking</button>

</div>

<div id="result"></div>

<div class="timeline" id="timeline"></div>

<div class="map">
<div class="dot" id="dot"></div>
</div>

</div>

<!-- WAREHOUSE -->
<div id="warehouse" class="section">
<h2>Warehouses</h2>

<div class="grid">
<div class="card">🇨🇳 China<br>iPhone Supplier Factory</div>
<div class="card">🇪🇬 Egypt<br>Near Cairo Airport & Port</div>
<div class="card">🇫🇷 France<br>Near Paris Airport & Port</div>
<div class="card">🇨🇦 Canada<br>Near Toronto Airport</div>
</div>

</div>

<script>

/* NAV */
function show(id){
document.querySelectorAll('.section,.hero').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

/* LOCATIONS */
const points={
China:{x:20,y:50},
Italy:{x:45,y:40},
Egypt:{x:30,y:65},
France:{x:55,y:35},
Canada:{x:60,y:30},
Germany:{x:50,y:35}
};

/* DISTANCE */
function dist(a,b){
let dx=a.x-b.x;
let dy=a.y-b.y;
return Math.sqrt(dx*dx+dy*dy)*100;
}

/* RUN */
function run(){

let from=document.getElementById("from").value;
let to=document.getElementById("to").value;
let weight=parseFloat(document.getElementById("weight").value);
let email=document.getElementById("email").value;
let resultBox=document.getElementById("result");

/* VALIDATION */
if(!weight || weight<=0){
resultBox.innerHTML="❌ Enter valid weight";
return;
}
if(!email.includes("@")){
resultBox.innerHTML="❌ Enter valid email";
return;
}

/* CALC */
let supplier=points[from];
let destination=points[to];

let productionMonths=8; // average
let shippingDays=Math.ceil(dist(supplier,destination)/20);
let totalDays=shippingDays+3;

let cost=weight*60;

/* RESULT */
resultBox.innerHTML=
`📱 <b>Product:</b> iPhone<br>
📦 Route: ${from} → ${to}<br>
⚖ Weight: ${weight} kg<br>
⏱ Total Time: ${totalDays} days + Production<br>
💰 Cost: $${cost}<br>
📧 Tracking sent to: ${email}`;

/* TIMELINE */
timeline.innerHTML = `

<h3>📱 Production Timeline</h3>
<div class="step">🧠 R&D — 6–12 Months</div>
<div class="step">🔧 Components — 2–4 Months</div>
<div class="step">🏭 Assembly (Foxconn / Pegatron) — 2–6 Weeks</div>
<div class="step">📦 Quality & Packaging — 1–2 Weeks</div>

<h3>🚚 Shipping Timeline</h3>
<div class="step">📦 Supplier → Warehouse (≤48h)</div>
<div class="step">✈️ Air: 2–7 Days | 🚢 Sea: 20–40 Days</div>
<div class="step">🛃 Customs — 1–7 Days</div>
<div class="step">🚚 Distribution — 2–5 Days</div>
<div class="step">📍 Final Delivery — 3 Days</div>

<h3>📦 Live Shipment</h3>
<div class="step">🏭 Production Completed</div>
<div class="step">📦 Packed in ${from}</div>
<div class="step">✈️ Shipping to ${to}</div>
<div class="step">📍 Delivered</div>
`;

/* ANIMATION */
let dot=document.getElementById("dot");

dot.style.left=supplier.x+"%";
dot.style.top=supplier.y+"%";

setTimeout(()=>{
dot.style.left=destination.x+"%";
dot.style.top=destination.y+"%";
},3000);

}

</script>

</body>
</html>

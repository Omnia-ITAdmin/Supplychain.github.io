<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Supply Chain</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial;background:#f4f6f9}

/* HEADER */
header{
background:#0B1F3A;color:white;
padding:15px 40px;
display:flex;justify-content:space-between;
}
nav a{margin-left:20px;cursor:pointer}

/* HERO */
.hero{
height:100vh;
background:linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg');
background-size:cover;
display:flex;flex-direction:column;
align-items:center;justify-content:center;
color:white;text-align:center;
}

/* SECTION */
.section{display:none;padding:50px;text-align:center}
.active{display:block}

/* FORM */
.form{
background:white;
padding:20px;
border-radius:10px;
max-width:400px;
margin:auto;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}
.form input, .form select{
width:100%;
padding:10px;
margin:10px 0;
}
button{padding:10px;background:gold;border:none}

/* MAP */
.map{
position:relative;
height:300px;
margin-top:30px;
background:url('https://upload.wikimedia.org/wikipedia/commons/8/80/World_map_-_low_resolution.svg');
background-size:cover;
}
.route{
position:absolute;
height:2px;
background:yellow;
top:60%;
left:20%;
width:0%;
transition:6s linear;
}
.dot{
width:12px;height:12px;background:red;
border-radius:50%;
position:absolute;
top:60%;left:20%;
transition:6s linear;
}
</style>
</head>

<body>

<header>
<h3>Smart Supply Chain</h3>
<nav>
<a onclick="show('home')">Home</a>
<a onclick="show('trackingPage')">Tracking</a>
</nav>
</header>

<!-- HOME -->
<div id="home" class="hero active">
<h1>Global Supply Chain</h1>
<p>Professional Tracking System</p>
</div>

<!-- TRACKING PAGE -->
<div id="trackingPage" class="section">

<h2>Shipment Tracking</h2>

<div class="form">

<select id="from">
<option>Egypt</option>
<option>France</option>
<option>Italy</option>
<option>Canada</option>
<option>Germany</option>
<option>USA</option>
</select>

<select id="to">
<option>France</option>
<option>Egypt</option>
<option>Italy</option>
<option>Canada</option>
<option>Germany</option>
<option>USA</option>
</select>

<input id="weight" placeholder="Weight (kg)">
<input id="email" placeholder="Email">

<button onclick="calculate()">Track Shipment</button>

</div>

<div id="result"></div>

<div class="map">
<div class="route" id="route"></div>
<div class="dot" id="dot"></div>
</div>

</div>

<script>

/* NAVIGATION */
function show(id){
document.querySelectorAll('.section, .hero').forEach(s=>s.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

/* DATA */
const countries={
Egypt:{x:30,y:65},
France:{x:55,y:35},
Italy:{x:45,y:40},
Canada:{x:60,y:30},
Germany:{x:50,y:35},
USA:{x:65,y:45}
};

/* DISTANCE */
function distance(a,b){
let dx=a.x-b.x;
let dy=a.y-b.y;
return Math.sqrt(dx*dx+dy*dy)*100;
}

/* CALCULATE */
function calculate(){

let from=document.getElementById("from").value;
let to=document.getElementById("to").value;
let weight=parseFloat(document.getElementById("weight").value);
let email=document.getElementById("email").value;

if(!weight || !email){
result.innerHTML="❌ Please enter all data";
return;
}

let dist=distance(countries[from],countries[to]);
let days=Math.ceil(dist/20);
let cost=weight*60;

result.innerHTML=
`📦 Shipment from ${from} → ${to}<br>
📏 Distance: ${dist.toFixed(1)} km<br>
⏱ Delivery: ${days} days<br>
💰 Cost: $${cost}<br>
📧 Details will be sent to ${email}`;

/* ANIMATION */
let dot=document.getElementById("dot");
let route=document.getElementById("route");

let start=countries[from];
let end=countries[to];

dot.style.left=start.x+"%";
dot.style.top=start.y+"%";
route.style.width="0%";

setTimeout(()=>{
dot.style.left=end.x+"%";
dot.style.top=end.y+"%";
route.style.width="50%";
},500);

}

</script>

</body>
</html>

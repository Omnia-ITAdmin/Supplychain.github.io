<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Supply Chain Tracker</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin:0;
    background:#f5f5f7;
}

/* HEADER */
header {
    background:#000;
    color:#fff;
    padding:20px;
    text-align:center;
}

/* NAV */
nav {
    display:flex;
    justify-content:center;
    background:#111;
}
nav a {
    color:#fff;
    padding:15px 20px;
    text-decoration:none;
}
nav a:hover {
    background:#333;
}

/* HERO */
.hero {
    text-align:center;
    padding:40px;
}
.hero h1 {
    font-size:32px;
}

/* SECTIONS */
section {
    padding:30px;
}

/* GRID */
.grid {
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(250px,1fr));
    gap:20px;
}

/* CARD */
.card {
    background:#fff;
    padding:20px;
    border-radius:15px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

/* BUTTON */
button {
    padding:10px 15px;
    border:none;
    background:#000;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
}
button:hover { background:#333; }

/* INPUT */
input {
    padding:10px;
    width:200px;
    margin-right:10px;
}

/* MAP */
#map {
    height:350px;
    border-radius:10px;
}

</style>
</head>

<body>

<header>
<h2>Global Supply Chain Tracker</h2>
</header>

<nav>
<a href="#home">Home</a>
<a href="#tracking">Tracking</a>
<a href="#mapSection">Map</a>
</nav>

<!-- HERO -->
<section class="hero" id="home">
<h1>Track Shipment Worldwide</h1>
<p>Simulating global logistics like Apple supply chain</p>
</section>

<!-- TRACKING -->
<section id="tracking">
<h2>Shipment Cost</h2>

<input type="number" id="steps" placeholder="Enter steps">
<button onclick="calc()">Calculate</button>

<div id="result" class="card"></div>
</section>

<!-- MAP -->
<section id="mapSection">
<h2>Shipment Route</h2>
<div id="map"></div>
</section>

<script>

// COST
function calc(){
    let n = document.getElementById("steps").value;

    if(n === "" || n < 0){
        document.getElementById("result").innerHTML = "Enter valid steps ❌";
        return;
    }

    let cost = 30 * Math.pow(1.1, n) * 1.5;

    document.getElementById("result").innerHTML =
    "<b>Final Cost:</b> $" + cost.toFixed(2);
}

// MAP
function initMap(){
    let map = new google.maps.Map(document.getElementById("map"), {
        zoom: 3,
        center: {lat:20, lng:0}
    });

    let route = [
        {lat:31.2304, lng:121.4737},
        {lat:25.2769, lng:55.2962},
        {lat:30.0444, lng:31.2357}
    ];

    new google.maps.Polyline({
        path: route,
        map: map,
        strokeColor: "#000"
    });
}

</script>

<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"
async defer></script>

</body>
</html>
